[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-rnn-gan"
version = "1.0.0"
description = "Handwriting generation with a Mixture-Density RNN (Graves 2013) and optional GAN refinement, trained on the IAM On-Line Handwriting dataset."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Yasar-17" },
]
keywords = [
    "handwriting-generation",
    "mdn",
    "recurrent-neural-networks",
    "lstm",
    "mixture-density-network",
    "gan",
    "attention",
    "iam-dataset",
    "pytorch",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.10"]
api = ["fastapi>=0.111", "uvicorn>=0.29", "Pillow>=10.0"]
demo = ["gradio>=4.0", "Pillow>=10.0"]

[project.urls]
Repository = "https://github.com/Yasar-17/Handwriting-Generation-Using-RNN"

[tool.setuptools]
py-modules = [
    "data",
    "losses",
    "models",
    "ema",
    "sampling",
    "train",
    "eval",
    "verify_model",
    "sanity_check",
    "generate_synthetic_data",
    "export_model",
    "inference",
    "augmentations",
    "api",
    "app",
    "benchmark",
    "render",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["__pycache__", "*.egg-info", "output*", "sanity_output", "synthetic_data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "N802", "N806", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N", "B"]
"__init__.py" = ["N999"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "output/", "output_conditioned/", "sanity_output/", "__pycache__/"]