[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-rnn-gan"
version = "1.0.0"
description = "Handwriting generation with a Mixture-Density RNN (Graves 2013) and optional GAN refinement, trained on the IAM On-Line Handwriting dataset."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Yasar-17" },
]
keywords = [
    "handwriting-generation",
    "mdn",
    "recurrent-neural-networks",
    "lstm",
    "mixture-density-network",
    "gan",
    "attention",
    "iam-dataset",
    "pytorch",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/Yasar-17/Handwriting-Generation-Using-RNN"

[tool.setuptools]
py-modules = [
    "data",
    "losses",
    "models",
    "train",
    "eval",
    "verify_model",
    "sanity_check",
    "generate_synthetic_data",
    "export_model",
    "inference",
    "augmentations",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]