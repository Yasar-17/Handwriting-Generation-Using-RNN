services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./output_conditioned:/app/output_conditioned:ro
      - ./output:/app/output:ro
    command: >
      sh -c "pip install fastapi uvicorn Pillow &&
             uvicorn api:app --host 0.0.0.0 --port 8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  gradio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    volumes:
      - ./output_conditioned:/app/output_conditioned:ro
      - ./output:/app/output:ro
    command: >
      sh -c "pip install gradio Pillow &&
             python app.py"
    environment:
      - PYTHONUNBUFFERED=1
